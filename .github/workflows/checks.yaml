name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Validate Compose
        run: docker compose config --quiet
        env:
          BOT_TOKEN: test-placeholder
          NOMINATIM_CONTACT_EMAIL: ci@example.org
      - run: docker build -t kuda-poyti-bot:check .
